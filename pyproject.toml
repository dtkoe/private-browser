[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "private-browser"
version = "0.1.0"
description = "Open-source anti-detect browser manager for Windows, built on Camoufox"
authors = [{name = "dtkoe"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "sqlcipher3-wheels>=0.5.4",
    "argon2-cffi>=23.1.0",
    "cryptography>=42.0.0",
    "structlog>=24.1.0",
    "camoufox[geoip]>=0.4",
    "playwright>=1.40",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "pywebview>=5.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.setuptools]
packages = ["backend", "backend.api", "backend.api.middleware", "backend.core", "backend.models", "backend.services"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "ASYNC"]
ignore = ["E501", "B008"]  # B008: FastAPI's Depends() in defaults is idiomatic

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["slow: opt-in slow tests (real Camoufox launches)"]
